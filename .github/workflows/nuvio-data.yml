name: Nuvio data

# One workflow for the nuvio-data repo:
#  - Upload nuvio-data.zip to the repo: it's unpacked (scripts, README), the zip is deleted,
#    and everything is updated straight away.
#  - Every day (and when you press Run workflow): the full update. The wrestling schedule and
#    the non-league football leagues and the other sports ESPN doesn't cover (fixtures, results,
#    teams) from TheSportsDB.
#  - Every 15 minutes from 7:00 to 22:45 UTC: scores for games that are on (non-league football,
#    rugby league, cricket, UK ice hockey, Gaelic games, netball). A run with no games on asks
#    TheSportsDB nothing.
on:
  push:
    paths:
      - "nuvio-data.zip"
  schedule:
    - cron: "17 9 * * *"           # full update: 9:17 UTC every day
    - cron: "*/15 7-22 * * *"      # scores: every day, 7:00-22:45 UTC (Australian evenings to UK nights; a run with no games on does nothing)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuvio-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Scheduled runs other than the daily one only update scores.
      MODE: ${{ (github.event_name == 'schedule' && github.event.schedule != '17 9 * * *') && 'scores' || 'full' }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack nuvio-data.zip (when one was uploaded)
        id: unpack
        run: |
          if [ ! -f nuvio-data.zip ]; then
            echo "No zip to unpack."
            echo "unpacked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Workflow files can't be changed by a workflow, so anything under .github is skipped
          # (this file is the only one the repo needs).
          unzip -o nuvio-data.zip -x ".github/*" "__MACOSX/*" "*.DS_Store"
          git rm -q --cached nuvio-data.zip || true
          rm -f nuvio-data.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack nuvio-data.zip"
          git push
          echo "unpacked=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: github.event_name != 'push' || steps.unpack.outputs.unpacked == 'true'
        with:
          python-version: "3.12"

      - name: Read the wrestling schedule from TheSportsDB
        if: env.MODE == 'full' && (github.event_name != 'push' || steps.unpack.outputs.unpacked == 'true')
        env:
          # Optional: a paid TheSportsDB key (Settings > Secrets and variables > Actions > Secrets).
          TSDB_KEY: ${{ secrets.TSDB_KEY }}
          # Optional: leagues whose logo licence you've checked, e.g. "wwe,aew" (… > Variables).
          WRESTLING_LOGOS: ${{ vars.WRESTLING_LOGOS }}
          # Optional: league ids to add, e.g. "aew=1234,tna=5678" (… > Variables).
          WRESTLING_LEAGUES: ${{ vars.WRESTLING_LEAGUES }}
        run: |
          if [ ! -f scripts/wrestling.py ]; then
            echo "scripts/wrestling.py is missing: upload nuvio-data.zip first."
            exit 1
          fi
          python scripts/wrestling.py

      - name: Non-league football and other sports from TheSportsDB
        if: github.event_name != 'push' || steps.unpack.outputs.unpacked == 'true'
        env:
          TSDB_KEY: ${{ secrets.TSDB_KEY }}
          # Optional: extra or skipped league ids, and leagues whose club badges you've checked.
          FOOTBALL_LEAGUES: ${{ vars.FOOTBALL_LEAGUES }}
          FOOTBALL_SKIP: ${{ vars.FOOTBALL_SKIP }}
          # Optional: other-sport league ids to leave out (… > Variables).
          OTHER_SKIP: ${{ vars.OTHER_SKIP }}
          # Set to "on" (… > Variables) once the TheSportsDB check looks good, and the new app is out.
          OTHER_SPORTS: ${{ vars.OTHER_SPORTS }}
          FOOTBALL_LOGOS: ${{ vars.FOOTBALL_LOGOS }}
        run: |
          if [ ! -f scripts/football.py ]; then
            echo "scripts/football.py is missing: upload nuvio-data.zip first."
            exit 0
          fi
          if [ "$MODE" = "scores" ]; then python scripts/football.py --scores; else python scripts/football.py; fi

      - name: Save what changed
        if: github.event_name != 'push' || steps.unpack.outputs.unpacked == 'true'
        run: |
          for p in wrestling.json football; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = "scores" ]; then git commit -q -m "Football scores"; else git commit -q -m "Schedule update"; fi
          git pull --rebase -q || true
          git push
