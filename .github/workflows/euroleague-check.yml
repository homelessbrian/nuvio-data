name: EuroLeague check

# Manual only: prints what the official EuroLeague feeds return, so the live score step
# can be checked against the real answers. Changes nothing.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/euroleague_probe.py
