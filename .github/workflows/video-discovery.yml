name: Video discovery (prototype)

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to scan
        type: choice
        options: [all, nfl, nba]
        default: all
      max_pages:
        description: Maximum new pages per sport in this test batch
        type: number
        default: 50
      reset_discovery:
        description: Archive existing checkpoint/catalogs and restart selected sports
        type: boolean
        default: false
      max_validations:
        description: Maximum player destinations to validate per sport
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: video-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video-discovery-prototype

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y awscli
          fi

      - name: Install crawler dependencies
        run: pip install -r requirements-video.txt

      - name: Check crawler syntax and tests
        run: |
          python -m py_compile scripts/video_discovery.py
          python -m unittest discover -s tests -v

      - name: Install Chromium for NBA dynamic-player validation
        if: ${{ inputs.site == 'all' || inputs.site == 'nba' }}
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Restore discovery checkpoint from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          RESET_DISCOVERY: ${{ inputs.reset_discovery || 'false' }}
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          BUCKET="${R2_BUCKET:-nuvio-sports}"
          mkdir -p "$RUNNER_TEMP/video-output"
          if [ "$RESET_DISCOVERY" = "true" ]; then
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            aws s3 cp "s3://$BUCKET/videos/state.json" "s3://$BUCKET/videos/archive/state-$STAMP.json" --endpoint-url "${R2_ENDPOINT%/}" --only-show-errors || echo "No prior checkpoint to archive."
            for FILE in index.json nfl.json nba.json; do
              aws s3 cp "s3://$BUCKET/videos/$FILE" "s3://$BUCKET/videos/archive/$STAMP/$FILE" --endpoint-url "${R2_ENDPOINT%/}" --only-show-errors || echo "No prior $FILE to archive."
            done
            rm -f "$RUNNER_TEMP/video-state.json"
          else
            aws s3 cp "s3://$BUCKET/videos/state.json" "$RUNNER_TEMP/video-state.json" --endpoint-url "${R2_ENDPOINT%/}" --only-show-errors || echo "No saved checkpoint yet; starting a fresh crawl."
          fi

      - name: Discover next batch
        env:
          SITE: ${{ inputs.site || 'all' }}
          MAX_PAGES: ${{ inputs.max_pages || '25' }}
          MAX_VALIDATIONS: ${{ inputs.max_validations || '10' }}
        run: |
          python scripts/video_discovery.py \
            --site "$SITE" \
            --max-pages "$MAX_PAGES" \
            --checkpoint-every 10 \
            --max-validations "$MAX_VALIDATIONS" \
            --validation-age-hours 24 \
            --browser-validation \
            --state-file "$RUNNER_TEMP/video-state.json" \
            --output-dir "$RUNNER_TEMP/video-output"

      - name: Upload checkpoint and catalog to R2
        if: always()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [ ! -f "$RUNNER_TEMP/video-state.json" ]; then
            echo "No checkpoint was produced; skipping upload."
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          BUCKET="${R2_BUCKET:-nuvio-sports}"
          aws s3 cp "$RUNNER_TEMP/video-state.json" "s3://$BUCKET/videos/state.json" --endpoint-url "${R2_ENDPOINT%/}" --content-type "application/json" --cache-control "no-cache" --only-show-errors
          aws s3 cp "$RUNNER_TEMP/video-output/" "s3://$BUCKET/videos/" --recursive --endpoint-url "${R2_ENDPOINT%/}" --content-type "application/json; charset=utf-8" --cache-control "no-cache" --only-show-errors

      - name: Report batch summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/video-output/index.json" ]; then
            cat "$RUNNER_TEMP/video-output/index.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No discovery output was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
