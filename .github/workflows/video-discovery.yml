name: Video discovery (prototype)

on:
  # The workflow definition lives on main so GitHub exposes the manual Run workflow button.
  # Select video-discovery-prototype in the branch dropdown to run the prototype code.
  workflow_dispatch:
    inputs:
      site:
        description: Site to scan
        type: choice
        options: [all, nfl, nba, mlb, rugby]
        default: nfl
      max_pages:
        description: Maximum pages to inspect per site
        type: number
        default: 3000

permissions:
  contents: read

concurrency:
  group: video-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: pip install -r requirements-video.txt

      - name: Discover event pages and player destinations
        run: |
          python scripts/video_discovery.py \\
            --site "${{ inputs.site }}" \\
            --max-pages "${{ inputs.max_pages }}" \\
            --output-dir "$RUNNER_TEMP/video-output"

      - name: Upload private JSON files to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ENDPOINT are required."
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          BUCKET="${R2_BUCKET:-nuvio-sports}"
          aws s3 cp "$RUNNER_TEMP/video-output/" "s3://$BUCKET/videos/" \\
            --recursive --endpoint-url "${R2_ENDPOINT%/}" \\
            --content-type "application/json; charset=utf-8" \\
            --cache-control "no-cache" --only-show-errors

      - name: Report scan summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/video-output/index.json" ]; then
            cat "$RUNNER_TEMP/video-output/index.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No discovery output was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
